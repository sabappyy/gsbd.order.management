<script>

const API =
"https://script.google.com/macros/s/AKfycbw0CMAM4E00q0gFAQ3XlHqnKt1l8RrzqFnwGfMXnr4xVgkAp-fBtR6kpaQMh5aFOkar/exec";

let products=[];



window.onload = async function(){

try{

/* Load Products */

let response = await fetch(API);

products = await response.json();


let productSelect =
document.getElementById(
"product"
);


productSelect.innerHTML =

products.map(

p =>

`<option value="${p.name}">

${p.name}

</option>`

).join("");



/* Load Moderators */

let modResponse =

await fetch(

API+

"?type=moderators"

);


let mods =

await modResponse.json();


document
.getElementById(
"moderator"
)

.innerHTML =

mods.map(

m=>

`<option>

${m}

</option>`

)

.join("");



updateBill();


}catch(err){

console.log(err);

alert(
"Failed loading products"
);

}

}




function updateBill(){


let selected =

products.find(

x=>

x.name===

document
.getElementById(
"product"
)

.value

)

||

{

price:0,

stock:0

};



document
.getElementById(
"price"
)

.innerText

=

selected.price;



document
.getElementById(
"stock"
)

.innerText

=

selected.stock;



let qty =

+

document
.getElementById(
"qty"
)

.value

||

0;



let discount=

+

document
.getElementById(
"discount"
)

.value

||

0;



let fee =

document
.getElementById(
"area"
)

.value

==

"Inside Dhaka"

?

60

:

120;



let total =


(

qty*

selected.price

)

-

discount

+

(

document
.getElementById(
"paid"
)

.value

==

"No"

?

fee

:

0

);



document
.getElementById(
"bill"
)

.innerText

=

Math.max(
0,
total
);

}



/* Events */

["product",

"qty",

"discount",

"area",

"paid"

]

.forEach(

id=>{

document

.getElementById(id)

.addEventListener(

"input",

updateBill

);

}

);





async function submitOrder(){


let customer=

document
.getElementById(
"name"
)

.value;



let phone=

document
.getElementById(
"phone"
)

.value;



let address=

document
.getElementById(
"address"
)

.value;



let qty=

+

document
.getElementById(
"qty"
)

.value;



if(

!customer

||

!phone

||

!address

||

!qty

){

alert(

"Fill all required fields"

);

return;

}



let selected=

products.find(

x=>

x.name===

product.value

);



if(

qty>

selected.stock

){

alert(

"Insufficient stock"

);

return;

}



let fee=

area.value

==

"Inside Dhaka"

?

60

:

120;



await fetch(

API,

{

method:

"POST",

body:

JSON.stringify({

name:

customer,

phone:

phone,

address:

address,

product:

product.value,

qty:

qty,

unitPrice:

selected.price,

deliveryArea:

area.value,

deliveryPaid:

paid.value,

deliveryFee:

fee,

discount:

+

discount.value

||

0,

finalBill:

+

bill.innerText,

note:

note.value,

moderator:

moderator.value

})

}

);



alert(

"Order Saved"

);



location.reload();

}



</script>
