```html
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSBD Order Management</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f7fb;
margin:0;
padding:20px;
}

.container{

max-width:700px;
margin:auto;

background:white;

padding:25px;

border-radius:20px;

box-shadow:
0 10px 25px rgba(
0,0,0,.08
);

}

h2{

margin-top:0;

}

input,
select,
textarea,
button{

width:100%;

padding:14px;

margin-top:8px;

margin-bottom:15px;

border:

1px solid #ddd;

border-radius:10px;

box-sizing:border-box;

}

.stats{

display:flex;

gap:10px;

}

.box{

flex:1;

background:#f8fafc;

padding:12px;

border-radius:10px;

}

button{

background:#111;

color:white;

border:none;

cursor:pointer;

}

button:hover{

opacity:.9;

}

</style>

</head>

<body>



<div class="container">

<h2>

GSBD Order Management

</h2>



<label>

Customer Name

</label>

<input id="name">



<label>

Phone

</label>

<input id="phone">



<label>

Address

</label>

<textarea id="address"></textarea>



<label>

Product

</label>

<select id="product">

<option>

Loading...

</option>

</select>



<div class="stats">

<div class="box">

Stock:

<b id="stock">

0

</b>

</div>



<div class="box">

Price:

৳

<b id="price">

0

</b>

</div>

</div>



<label>

Qty

</label>

<input

type="number"

id="qty"

>



<label>

Delivery Area

</label>

<select id="area">

<option>

Inside Dhaka

</option>

<option>

Outside Dhaka

</option>

</select>



<label>

Delivery Paid?

</label>

<select id="paid">

<option>

Yes

</option>

<option>

No

</option>

</select>



<label>

Discount

</label>

<input

type="number"

id="discount"

value="0"

>



<label>

Moderator

</label>

<select id="moderator">

<option>

Loading...

</option>

</select>



<label>

Note

</label>

<textarea id="note">

</textarea>



<div class="box">

Final Bill:

৳

<b id="bill">

0

</b>

</div>



<br>



<button

onclick="submitOrder()"

>

Confirm Order

</button>



</div>




<script>

const API=

"https://script.google.com/macros/s/AKfycbw0CMAM4E00q0gFAQ3XlHqnKt1l8RrzqFnwGfMXnr4xVgkAp-fBtR6kpaQMh5aFOkar/exec";


let products=[];



async function loadData(){

try{


let productData=

await fetch(
API
);


products=

await productData
.json();



document
.getElementById(
"product"
)

.innerHTML=

products.map(

p=>

`<option value="${p.name}">

${p.name}

</option>`

)

.join("");




let modData=

await fetch(

API+

"?type=moderators"

);


let mods=

await modData
.json();



document
.getElementById(
"moderator"
)

.innerHTML=

mods.map(

m=>

`<option>

${m}

</option>`

)

.join("");



updateBill();


}catch(e){

alert(

"Failed loading products"

);

console.log(
e
);

}

}



loadData();



function updateBill(){


let selected=

products.find(

x=>

x.name===

document
.getElementById(
"product"
)

.value

)

||

{

price:0,

stock:0

};



document
.getElementById(
"stock"
)

.innerText

=

selected.stock;



document
.getElementById(
"price"
)

.innerText

=

selected.price;



let qty=

+

document
.getElementById(
"qty"
)

.value

||

0;



let discount=

+

document
.getElementById(
"discount"
)

.value

||

0;



let fee=

document
.getElementById(
"area"
)

.value

==

"Inside Dhaka"

?

60

:

120;



let total=


(

qty*

selected.price

)

-

discount

+

(

document
.getElementById(
"paid"
)

.value

==

"No"

?

fee

:

0

);



document
.getElementById(
"bill"
)

.innerText

=

Math.max(
0,
total
);

}



[

"product",

"qty",

"discount",

"area",

"paid"

]

.forEach(

id=>{

document
.getElementById(
id
)

.addEventListener(

"change",

updateBill

);

}

);





async function submitOrder(){


let customer=

document
.getElementById(
"name"
)

.value;


let phone=

document
.getElementById(
"phone"
)

.value;


let address=

document
.getElementById(
"address"
)

.value;


let qty=

+

document
.getElementById(
"qty"
)

.value;



if(

!customer

||

!phone

||

!address

||

!qty

){

alert(

"Fill all required fields"

);

return;

}



let selected=

products.find(

x=>

x.name===

document
.getElementById(
"product"
)

.value

);



if(

qty>

selected.stock

){

alert(

"Insufficient stock"

);

return;

}



let fee=

document
.getElementById(
"area"
)

.value

==

"Inside Dhaka"

?

60

:

120;



await fetch(

API,

{

method:

"POST",

body:

JSON.stringify({

name:

customer,

phone:

phone,

address:

address,

product:

selected.name,

qty:

qty,

unitPrice:

selected.price,

deliveryArea:

area.value,

deliveryPaid:

paid.value,

deliveryFee:

fee,

discount:

+

discount.value

||

0,

finalBill:

+

bill.innerText,

note:

note.value,

moderator:

moderator.value

})

}

);



alert(

"Order Saved"

);



location.reload();


}


</script>



</body>

</html>
```
