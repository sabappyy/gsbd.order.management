<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GSBD Order Management</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 30px 15px;

      background: #f4f7fb;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #111;

    }


    .container {

      width: 100%;

      max-width: 680px;

      margin: 0 auto;

      background: #fff;

      border-radius: 18px;

      padding: 28px;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,0.08);

    }


    h1 {

      margin: 0 0 6px;

      font-size: 25px;

    }


    .subtitle {

      color: #777;

      margin-bottom: 25px;

      font-size: 14px;

    }


    .field {

      margin-bottom: 17px;

    }


    label {

      display: block;

      font-weight: 600;

      margin-bottom: 7px;

      font-size: 14px;

    }


    input,
    textarea,
    select {

      width: 100%;

      border: 1px solid #d8dce3;

      border-radius: 9px;

      padding: 13px;

      font-size: 14px;

      outline: none;

      background: #fff;

    }


    input:focus,
    textarea:focus,
    select:focus {

      border-color: #111;

    }


    textarea {

      min-height: 85px;

      resize: vertical;

    }


    .required {

      color: #e00000;

    }


    .search-wrapper {

      position: relative;

    }


    .search-icon {

      position: absolute;

      right: 13px;

      top: 50%;

      transform:
        translateY(-50%);

      font-size: 18px;

      pointer-events: none;

    }


    .search-status {

      margin-top: 6px;

      font-size: 12px;

      color: #777;

      min-height: 16px;

    }


    .product-select {

      margin-top: 3px;

    }


    .product-info {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;

      margin-top: 10px;

    }


    .info-box {

      background: #f6f8fa;

      border-radius: 9px;

      padding: 12px;

      min-height: 55px;

    }


    .info-label {

      font-size: 11px;

      color: #777;

      margin-bottom: 4px;

    }


    .info-value {

      font-weight: 600;

      font-size: 14px;

    }


    .two-column {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;

    }


    .bill {

      margin-top: 12px;

      padding: 15px;

      background: #f6f8fa;

      border-radius: 9px;

      font-size: 17px;

      font-weight: 600;

    }


    .bill-row {

      display: flex;

      justify-content: space-between;

      margin-bottom: 7px;

      font-size: 13px;

      font-weight: 400;

      color: #555;

    }


    .bill-total {

      display: flex;

      justify-content: space-between;

      padding-top: 8px;

      border-top:
        1px solid #ddd;

      font-size: 17px;

      color: #111;

      font-weight: 700;

    }


    button {

      width: 100%;

      border: 0;

      border-radius: 9px;

      padding: 14px;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

    }


    .submit-btn {

      background: #111;

      color: #fff;

      margin-top: 15px;

    }


    .submit-btn:hover {

      background: #222;

    }


    .submit-btn:disabled {

      background: #999;

      cursor: not-allowed;

    }


    .loading {

      opacity: 0.65;

      pointer-events: none;

    }


    .modal-overlay {

      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,0.55);

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;

      z-index: 9999;

    }


    .modal {

      width: 100%;

      max-width: 430px;

      background: #fff;

      border-radius: 18px;

      padding: 25px;

      text-align: center;

      box-shadow:
        0 15px 50px
        rgba(0,0,0,0.25);

    }


    .modal-icon {

      font-size: 30px;

      margin-bottom: 8px;

    }


    .modal h2 {

      margin:
        0 0 10px;

      font-size: 21px;

    }


    .modal p {

      margin: 6px 0;

      color: #555;

      font-size: 14px;

    }


    .modal-btn {

      background: #111;

      color: #fff;

      margin-top: 18px;

    }


    .error-modal h2 {

      color: #c40000;

    }


    @media (
      max-width: 600px
    ) {

      body {

        padding: 12px;

      }


      .container {

        padding: 20px;

        border-radius: 14px;

      }


      .two-column {

        grid-template-columns:
          1fr;

        gap: 0;

      }


      .product-info {

        grid-template-columns:
          1fr 1fr 1fr;

      }

    }

  </style>

</head>


<body>


  <div class="container">

    <h1>
      GSBD Order Management
    </h1>


    <div class="subtitle">
      Order Confirmation & Inventory Management
    </div>


    <!-- CUSTOMER NAME -->

    <div class="field">

      <label>
        Customer Name
        <span class="required">*</span>
      </label>

      <input
        id="customerName"
        type="text"
        placeholder="Enter customer name"
      >

    </div>


    <!-- PHONE -->

    <div class="field">

      <label>
        Phone Number
        <span class="required">*</span>
      </label>

      <input
        id="phone"
        type="text"
        placeholder="Enter phone number"
      >

    </div>


    <!-- ADDRESS -->

    <div class="field">

      <label>
        Customer Address
        <span class="required">*</span>
      </label>

      <textarea
        id="address"
        placeholder="Enter address"
      ></textarea>

    </div>


    <!-- SEARCH -->

    <div class="field">

      <label>
        Search Product
      </label>


      <div class="search-wrapper">

        <input
          id="productSearch"
          type="text"
          placeholder="Type product name, brand or code..."
          autocomplete="off"
        >

        <span class="search-icon">
          🔍
        </span>

      </div>


      <div
        id="searchStatus"
        class="search-status"
      >
        Loading products...
      </div>

    </div>


    <!-- PRODUCT -->

    <div class="field">

      <label>
        Product
        <span class="required">*</span>
      </label>


      <select
        id="productSelect"
        class="product-select"
      >

        <option value="">
          Loading...
        </option>

      </select>


      <div class="product-info">

        <div class="info-box">

          <div class="info-label">
            Colour
          </div>

          <div
            id="colour"
            class="info-value"
          >
            -
          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            Stock Left
          </div>

          <div
            id="stock"
            class="info-value"
          >
            0
          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            Selling Price
          </div>

          <div
            id="unitPrice"
            class="info-value"
          >
            ৳0
          </div>

        </div>

      </div>

    </div>


    <!-- QUANTITY -->

    <div class="field">

      <label>
        Quantity
        <span class="required">*</span>
      </label>

      <input
        id="quantity"
        type="number"
        min="1"
        step="1"
        placeholder="Enter quantity"
      >

    </div>


    <!-- DELIVERY -->

    <div class="two-column">

      <div class="field">

        <label>
          Delivery Area
          <span class="required">*</span>
        </label>

        <select id="deliveryArea">

          <option value="Inside Dhaka">
            Inside Dhaka
          </option>

          <option value="Outside Dhaka">
            Outside Dhaka
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          Customer Paid Delivery?
          <span class="required">*</span>
        </label>

        <select id="deliveryPaid">

          <option value="">
            Select option
          </option>

          <option value="Yes">
            Yes
          </option>

          <option value="No">
            No
          </option>

        </select>

      </div>

    </div>


    <!-- DISCOUNT -->

    <div class="field">

      <label>
        Discount (৳)
      </label>

      <input
        id="discount"
        type="number"
        min="0"
        step="1"
        placeholder="Optional"
      >

    </div>


    <!-- MODERATOR -->

    <div class="field">

      <label>
        Moderator
        <span class="required">*</span>
      </label>

      <select id="moderator">

        <option value="">
          Loading...
        </option>

      </select>

    </div>


    <!-- NOTES -->

    <div class="field">

      <label>
        Order Notes
      </label>

      <textarea
        id="notes"
        placeholder="Optional"
      ></textarea>

    </div>


    <!-- BILL -->

    <div class="bill">

      <div class="bill-row">

        <span>
          Product Total
        </span>

        <span id="billSubtotal">
          ৳0
        </span>

      </div>


      <div class="bill-row">

        <span>
          Delivery Fee
        </span>

        <span id="billDelivery">
          ৳0
        </span>

      </div>


      <div class="bill-row">

        <span>
          Discount
        </span>

        <span id="billDiscount">
          ৳0
        </span>

      </div>


      <div class="bill-total">

        <span>
          Final Bill
        </span>

        <span id="finalBill">
          ৳0
        </span>

      </div>

    </div>


    <!-- SUBMIT -->

    <button
      id="submitBtn"
      class="submit-btn"
      type="button"
    >
      Confirm Order
    </button>

  </div>


  <!-- SUCCESS MODAL -->

  <div
    id="successModal"
    class="modal-overlay"
  >

    <div class="modal">

      <div class="modal-icon">
        ✅
      </div>

      <h2>
        Order Saved
      </h2>

      <p>
        Order saved successfully.
      </p>

      <p>
        <strong id="successProduct">
          -
        </strong>
      </p>

      <p>
        Remaining stock:
        <strong id="successStock">
          -
        </strong>
      </p>

      <p>
        Final Bill:
        <strong id="successBill">
          -
        </strong>
      </p>

      <button
        class="modal-btn"
        onclick="closeSuccessModal()"
      >
        OK
      </button>

    </div>

  </div>


  <!-- ERROR MODAL -->

  <div
    id="errorModal"
    class="modal-overlay"
  >

    <div class="modal error-modal">

      <div class="modal-icon">
        ❌
      </div>

      <h2>
        Error
      </h2>

      <p id="errorMessage">
        Something went wrong.
      </p>

      <button
        class="modal-btn"
        onclick="closeErrorModal()"
      >
        OK
      </button>

    </div>

  </div>


  <script>


    /********************************************************
     * CONFIG
     ********************************************************/

    const API_URL =
      'https://script.google.com/macros/s/AKfycbxDeyvSbDNY6_CqQYD4ao08aPDzhMHLK9xB-gsOG3ITvjIQa4S_fqctAWZL7szJovRrKQ/exec';


    /*
     * Product data loaded from Google Apps Script.
     */

    let products = [];


    let filteredProducts = [];


    /********************************************************
     * DOM
     ********************************************************/

    const customerName =
      document.getElementById(
        'customerName'
      );


    const phone =
      document.getElementById(
        'phone'
      );


    const address =
      document.getElementById(
        'address'
      );


    const productSearch =
      document.getElementById(
        'productSearch'
      );


    const searchStatus =
      document.getElementById(
        'searchStatus'
      );


    const productSelect =
      document.getElementById(
        'productSelect'
      );


    const colour =
      document.getElementById(
        'colour'
      );


    const stock =
      document.getElementById(
        'stock'
      );


    const unitPrice =
      document.getElementById(
        'unitPrice'
      );


    const quantity =
      document.getElementById(
        'quantity'
      );


    const deliveryArea =
      document.getElementById(
        'deliveryArea'
      );


    const deliveryPaid =
      document.getElementById(
        'deliveryPaid'
      );


    const discount =
      document.getElementById(
        'discount'
      );


    const moderator =
      document.getElementById(
        'moderator'
      );


    const notes =
      document.getElementById(
        'notes'
      );


    const submitBtn =
      document.getElementById(
        'submitBtn'
      );


    const billSubtotal =
      document.getElementById(
        'billSubtotal'
      );


    const billDelivery =
      document.getElementById(
        'billDelivery'
      );


    const billDiscount =
      document.getElementById(
        'billDiscount'
      );


    const finalBill =
      document.getElementById(
        'finalBill'
      );


    /********************************************************
     * FORMAT MONEY
     ********************************************************/

    function money(value) {

      const number =
        Number(value) || 0;


      return (
        '৳' +
        number.toLocaleString(
          'en-BD',
          {
            maximumFractionDigits: 0
          }
        )
      );

    }


    /********************************************************
     * DELIVERY FEE
     ********************************************************/

    function getDeliveryFee() {

      return
        deliveryArea.value ===
        'Outside Dhaka'
          ? 120
          : 60;

    }


    /********************************************************
     * FETCH API
     ********************************************************/

    async function apiGet(
      type
    ) {

      const url =
        API_URL +
        '?type=' +
        encodeURIComponent(
          type
        ) +
        '&_=' +
        Date.now();


      const response =
        await fetch(
          url,
          {
            method: 'GET',
            cache: 'no-store'
          }
        );


      const text =
        await response.text();


      let data;


      try {

        data =
          JSON.parse(text);

      } catch (error) {

        throw new Error(
          'Invalid API response.'
        );

      }


      if (
        !data.success
      ) {

        throw new Error(
          data.message ||
          'API request failed.'
        );

      }


      return data;

    }


    /********************************************************
     * LOAD PRODUCTS
     ********************************************************/

    async function loadProducts() {

      searchStatus.textContent =
        'Loading products...';


      try {

        const data =
          await apiGet(
            'products'
          );


        products =
          Array.isArray(
            data.products
          )
            ? data.products
            : [];


        /*
         * Extra safety:
         * Never show category header rows.
         */

        products =
          products.filter(
            function(product) {

              const name =
                String(
                  product.name || ''
                ).trim();


              return (
                name &&
                !/^\*+.*\*+$/.test(
                  name
                )
              );

            }
          );


        filteredProducts =
          products.slice();


        renderProducts(
          filteredProducts
        );


        searchStatus.textContent =
          products.length +
          ' products available.';


      } catch (error) {

        searchStatus.textContent =
          'Unable to load products.';


        showError(
          error.message
        );

      }

    }


    /********************************************************
     * LOAD MODERATORS
     ********************************************************/

    async function loadModerators() {

      try {

        const data =
          await apiGet(
            'moderators'
          );


        const moderators =
          Array.isArray(
            data.moderators
          )
            ? data.moderators
            : [];


        moderator.innerHTML =
          '<option value="">Select moderator</option>';


        moderators.forEach(
          function(name) {

            const option =
              document.createElement(
                'option'
              );


            option.value =
              name;


            option.textContent =
              name;


            moderator.appendChild(
              option
            );

          }
        );


        if (
          moderators.length === 0
        ) {

          moderator.innerHTML =
            '<option value="">No moderators found</option>';

        }


      } catch (error) {

        moderator.innerHTML =
          '<option value="">Unable to load moderators</option>';

        showError(
          error.message
        );

      }

    }


    /********************************************************
     * RENDER PRODUCTS
     ********************************************************/

    function renderProducts(
      list
    ) {

      productSelect.innerHTML =
        '';


      if (
        list.length === 0
      ) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          '';


        option.textContent =
          'No matching products';


        productSelect.appendChild(
          option
        );


        clearProductInfo();

        return;

      }


      const defaultOption =
        document.createElement(
          'option'
        );


      defaultOption.value =
        '';


      defaultOption.textContent =
        'Select product';


      productSelect.appendChild(
        defaultOption
      );


      list.forEach(
        function(product) {

          const option =
            document.createElement(
              'option'
            );


          /*
           * Use row number as unique identifier.
           */

          option.value =
            String(
              product.row
            );


          let label =
            product.name;


          if (
            product.colour
          ) {

            label +=
              ' — ' +
              product.colour;

          }


          if (
            product.productCode
          ) {

            label +=
              ' [' +
              product.productCode +
              ']';

          }


          option.textContent =
            label;


          productSelect.appendChild(
            option
          );

        }
      );


      /*
       * Automatically select the first matching
       * product when there is exactly one match.
       */

      if (
        list.length === 1
      ) {

        productSelect.value =
          String(
            list[0].row
          );


        updateProductInfo();

      } else {

        clearProductInfo();

      }

    }


    /********************************************************
     * SEARCH PRODUCTS
     ********************************************************/

    productSearch.addEventListener(
      'input',
      function() {

        const query =
          productSearch.value
            .trim()
            .toLowerCase();


        if (!query) {

          filteredProducts =
            products.slice();


          searchStatus.textContent =
            products.length +
            ' products available.';


          renderProducts(
            filteredProducts
          );

          return;

        }


        filteredProducts =
          products.filter(
            function(product) {

              const combined =
                [
                  product.name,
                  product.brand,
                  product.category,
                  product.productCode,
                  product.colour
                ]
                  .join(' ')
                  .toLowerCase();


              return combined.includes(
                query
              );

            }
          );


        searchStatus.textContent =
          filteredProducts.length +
          ' matching product(s).';


        renderProducts(
          filteredProducts
        );

      }
    );


    /********************************************************
     * PRODUCT CHANGE
     ********************************************************/

    productSelect.addEventListener(
      'change',
      updateProductInfo
    );


    function getSelectedProduct() {

      const row =
        Number(
          productSelect.value
        );


      if (!row) {

        return null;

      }


      return (
        products.find(
          function(product) {

            return (
              Number(product.row) ===
              row
            );

          }
        ) ||
        filteredProducts.find(
          function(product) {

            return (
              Number(product.row) ===
              row
            );

          }
        ) ||
        null
      );

    }


    function updateProductInfo() {

      const product =
        getSelectedProduct();


      if (!product) {

        clearProductInfo();

        updateBill();

        return;

      }


      colour.textContent =
        product.colour ||
        '-';


      stock.textContent =
        Number(
          product.stock || 0
        );


      unitPrice.textContent =
        money(
          product.price
        );


      quantity.max =
        Math.max(
          0,
          Number(
            product.stock || 0
          )
        );


      updateBill();

    }


    function clearProductInfo() {

      colour.textContent =
        '-';


      stock.textContent =
        '0';


      unitPrice.textContent =
        '৳0';


      quantity.removeAttribute(
        'max'
      );

    }


    /********************************************************
     * BILL
     ********************************************************/

    function updateBill() {

      const product =
        getSelectedProduct();


      const qty =
        Math.max(
          0,
          Number(
            quantity.value
          ) || 0
        );


      const discountValue =
        Math.max(
          0,
          Number(
            discount.value
          ) || 0
        );


      if (!product) {

        billSubtotal.textContent =
          '৳0';

        billDelivery.textContent =
          '৳0';

        billDiscount.textContent =
          '৳0';

        finalBill.textContent =
          '৳0';

        return;

      }


      const subtotal =
        Number(
          product.price || 0
        ) *
        qty;


      const safeDiscount =
        Math.min(
          discountValue,
          subtotal
        );


      const deliveryFee =
        deliveryArea.value ===
        'Outside Dhaka'
          ? 120
          : 60;


      /*
       * Customer paid delivery = Yes
       * -> don't add delivery to final bill.
       *
       * Customer paid delivery = No
       * -> add delivery to final bill.
       */

      const billDeliveryAmount =
        deliveryPaid.value ===
        'Yes'
          ? 0
          : deliveryFee;


      const total =
        Math.max(
          0,
          subtotal -
          safeDiscount +
          billDeliveryAmount
        );


      billSubtotal.textContent =
        money(
          subtotal
        );


      billDelivery.textContent =
        money(
          billDeliveryAmount
        );


      billDiscount.textContent =
        money(
          safeDiscount
        );


      finalBill.textContent =
        money(
          total
        );

    }


    quantity.addEventListener(
      'input',
      updateBill
    );


    discount.addEventListener(
      'input',
      updateBill
    );


    deliveryArea.addEventListener(
      'change',
      updateBill
    );


    deliveryPaid.addEventListener(
      'change',
      updateBill
    );


    /********************************************************
     * SUBMIT ORDER
     ********************************************************/

    submitBtn.addEventListener(
      'click',
      submitOrder
    );


    async function submitOrder() {

      const product =
        getSelectedProduct();


      /*
       * VALIDATION
       */

      if (
        !customerName.value.trim()
      ) {

        showError(
          'Customer name is required.'
        );

        customerName.focus();

        return;

      }


      if (
        !phone.value.trim()
      ) {

        showError(
          'Phone number is required.'
        );

        phone.focus();

        return;

      }


      if (
        !address.value.trim()
      ) {

        showError(
          'Customer address is required.'
        );

        address.focus();

        return;

      }


      if (!product) {

        showError(
          'Please select a product.'
        );

        return;

      }


      const qty =
        Math.floor(
          Number(
            quantity.value
          ) || 0
        );


      if (
        qty < 1
      ) {

        showError(
          'Quantity must be at least 1.'
        );

        quantity.focus();

        return;

      }


      const currentStock =
        Number(
          product.stock || 0
        );


      if (
        qty > currentStock
      ) {

        showError(
          'Quantity cannot be greater than current stock.'
        );

        return;

      }


      if (
        !deliveryPaid.value
      ) {

        showError(
          'Please select whether the customer paid delivery.'
        );

        return;

      }


      if (
        !moderator.value
      ) {

        showError(
          'Please select a moderator.'
        );

        return;

      }


      const discountValue =
        Math.max(
          0,
          Number(
            discount.value
          ) || 0
        );


      /*
       * Disable button while saving.
       */

      submitBtn.disabled =
        true;


      submitBtn.textContent =
        'Saving Order...';


      try {

        /*
         * IMPORTANT:
         *
         * We send the row number AND product code.
         *
         * Apps Script re-checks the product directly
         * from Price List(Master) before saving.
         */

        const payload = {

          action:
            'createOrder',

          customerName:
            customerName.value.trim(),

          phone:
            phone.value.trim(),

          address:
            address.value.trim(),

          productName:
            product.name,

          productCode:
            product.productCode,

          row:
            product.row,

          quantity:
            qty,

          deliveryArea:
            deliveryArea.value,

          deliveryPaid:
            deliveryPaid.value,

          discount:
            discountValue,

          moderator:
            moderator.value,

          notes:
            notes.value.trim()

        };


        /*
         * Use POST.
         */

        const response =
          await fetch(
            API_URL,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'text/plain;charset=utf-8'
              },

              body:
                JSON.stringify(
                  payload
                )

            }
          );


        const text =
          await response.text();


        let data;


        try {

          data =
            JSON.parse(
              text
            );

        } catch (error) {

          throw new Error(
            'Invalid response from Apps Script.'
          );

        }


        if (
          !data.success
        ) {

          throw new Error(
            data.message ||
            'Unable to save order.'
          );

        }


        /*
         * SUCCESS
         */

        showSuccess(
          data.order
        );


      } catch (error) {

        showError(
          error.message
        );

      } finally {

        submitBtn.disabled =
          false;


        submitBtn.textContent =
          'Confirm Order';

      }

    }


    /********************************************************
     * SUCCESS
     ********************************************************/

    function showSuccess(
      order
    ) {

      document.getElementById(
        'successProduct'
      ).textContent =
        order.product || '-';


      document.getElementById(
        'successStock'
      ).textContent =
        order.remainingStock ?? '-';


      document.getElementById(
        'successBill'
      ).textContent =
        money(
          order.finalBill
        );


      document.getElementById(
        'successModal'
      ).style.display =
        'flex';

    }


    function closeSuccessModal() {

      document.getElementById(
        'successModal'
      ).style.display =
        'none';


      /*
       * Reset form after successful order.
       */

      resetForm();


      /*
       * Reload fresh stock/products.
       */

      loadProducts();

    }


    /********************************************************
     * ERROR
     ********************************************************/

    function showError(
      message
    ) {

      document.getElementById(
        'errorMessage'
      ).textContent =
        message ||
        'Something went wrong.';


      document.getElementById(
        'errorModal'
      ).style.display =
        'flex';

    }


    function closeErrorModal() {

      document.getElementById(
        'errorModal'
      ).style.display =
        'none';

    }


    /********************************************************
     * RESET FORM
     ********************************************************/

    function resetForm() {

      customerName.value =
        '';


      phone.value =
        '';


      address.value =
        '';


      productSearch.value =
        '';


      quantity.value =
        '';


      discount.value =
        '';


      notes.value =
        '';


      deliveryArea.value =
        'Inside Dhaka';


      deliveryPaid.value =
        '';


      moderator.value =
        '';


      filteredProducts =
        products.slice();


      renderProducts(
        filteredProducts
      );


      clearProductInfo();


      updateBill();

    }


    /********************************************************
     * INITIALIZE
     ********************************************************/

    async function initialize() {

      /*
       * Load both independently.
       */

      await Promise.all([
        loadProducts(),
        loadModerators()
      ]);

    }


    initialize();

  </script>

</body>

</html>
