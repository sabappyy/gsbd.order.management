<!DOCTYPE html>
<html>
<head>

<meta
name="viewport"
content="width=device-width, initial-scale=1"
>

<title>

GSBD Order Management

</title>


<style>

body{

font-family:Arial;

background:#f4f7fb;

margin:0;

padding:20px;

}


.container{

max-width:700px;

margin:auto;

background:white;

padding:25px;

border-radius:20px;

box-shadow:

0 10px 25px rgba(
0,0,0,.08
);

}



input,
select,
textarea,
button{

width:100%;

padding:14px;

margin:8px 0;

border:

1px solid #ddd;

border-radius:10px;

box-sizing:border-box;

}



button{

background:#111;

color:white;

border:none;

cursor:pointer;

font-size:16px;

}



.stats{

display:flex;

gap:10px;

}



.box{

flex:1;

background:#f8fafc;

padding:12px;

border-radius:10px;

}



/* loading */

#loading{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:

rgba(

0,0,0,.5

);

justify-content:center;

align-items:center;

color:white;

font-size:24px;

z-index:999;

}



/* popup */

#success{

display:none;

position:fixed;

top:50%;

left:50%;

transform:

translate(

-50%,

-50%

);

background:white;

padding:30px;

border-radius:20px;

box-shadow:

0 0 25px rgba(
0,0,0,.2
);

z-index:1000;

text-align:center;

}

</style>

</head>


<body>



<div id="loading">

Submitting Order...

</div>



<div id="success">

<h2>

✅ খেলা শেষ

</h2>


<p>

Order saved successfully

</p>


<button

onclick="closePopup()"

>

OK

</button>


</div>




<div class="container">


<h2>

GSBD Order Management

</h2>




<input

id="name"

placeholder="Customer Name"

>




<input

id="phone"

placeholder="Phone"

>




<textarea

id="address"

placeholder="Address"

>

</textarea>




<select id="product">

<option>

Loading Products...

</option>

</select>




<div class="stats">


<div class="box">

Stock:

<b id="stock">

0

</b>

</div>



<div class="box">

Price:

৳

<b id="price">

0

</b>

</div>



</div>




<input

id="qty"

type="number"

placeholder="Qty"

>




<select id="area">

<option>

Inside Dhaka

</option>


<option>

Outside Dhaka

</option>

</select>




<select id="paid">

<option>

Yes

</option>


<option>

No

</option>

</select>




<input

id="discount"

type="number"

placeholder="Discount (optional)"

value="0"

>




<select id="moderator">

<option>

Loading...

</option>

</select>




<textarea

id="note"

placeholder="Note"

>

</textarea>




<div class="box">

Final Bill:

৳

<b id="bill">

0

</b>

</div>



<br>



<button

onclick="submitOrder()"

>

Confirm Order

</button>


</div>





<script>


const API=

"https://script.google.com/macros/s/AKfycbw0CMAM4E00q0gFAQ3XlHqnKt1l8RrzqFnwGfMXnr4xVgkAp-fBtR6kpaQMh5aFOkar/exec";


let products=[];



async function load(){


products=

await(

await fetch(
API
)

)

.json();



product.innerHTML=

products.map(

p=>

`<option>

${p.name}

</option>`

)

.join('');



let mods=

await(

await fetch(

API+

"?type=moderators"

)

)

.json();



moderator.innerHTML=

mods.map(

m=>

`<option>

${m}

</option>`

)

.join('');



update();


}



load();




function update(){


let p=

products.find(

x=>

x.name===

product.value

)

||

{

price:0,

stock:0

};



stock.innerText=

p.stock;



price.innerText=

p.price;



let fee=

area.value==

"Inside Dhaka"

?

60

:

120;



let discountValue=

+

discount.value

||

0;



let total=


(

(

+

qty.value

||

0

)

*

p.price

)

-

discountValue

+

(

paid.value

==

"No"

?

fee

:

0

);



bill.innerText=

Math.max(

0,

total

);


}




[

product,

qty,

area,

paid,

discount

]

.forEach(

x=>

x.addEventListener(

"change",

update

)

);







async function submitOrder(){



if(

!name.value.trim()

||

!phone.value.trim()

||

!address.value.trim()

||

!qty.value

||

!product.value

||

!moderator.value

||

!area.value

||

!paid.value

){

alert(

"Please fill all required fields"

);

return;

}




let selected=

products.find(

x=>

x.name===

product.value

);



if(

+

qty.value

>

selected.stock

){

alert(

"Insufficient stock"

);

return;

}



loading.style.display=

"flex";




let fee=

area.value==

"Inside Dhaka"

?

60

:

120;




let discountValue=

+

discount.value

||

0;




let finalBill=

(

+

qty.value

*

selected.price

)

-

discountValue

+

(

paid.value

==

"No"

?

fee

:

0

);





await fetch(

API,

{

method:

"POST",

body:

JSON.stringify({

name:

name.value,

phone:

phone.value,

address:

address.value,

product:

product.value,

qty:

+

qty.value,

unitPrice:

selected.price,

deliveryArea:

area.value,

deliveryPaid:

paid.value,

deliveryFee:

fee,

discount:

discountValue,

finalBill:

finalBill,

note:

note.value,

moderator:

moderator.value

})

}

);




loading.style.display=

"none";


success.style.display=

"block";


}




function closePopup(){


success.style.display=

"none";


location.reload();


}



</script>



</body>

</html>
