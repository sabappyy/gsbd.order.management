<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GSBD Order Management</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  padding:20px;
  margin:0;
}

.container{
  max-width:700px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

h2{
  margin-bottom:5px;
}

.sub{
  color:#666;
  margin-bottom:25px;
}

label{
  display:block;
  font-weight:600;
  margin-top:12px;
  margin-bottom:5px;
}

input,
select,
textarea,
button{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  box-sizing:border-box;
  margin-bottom:5px;
}

textarea{
  min-height:80px;
}

.stats{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.box{
  flex:1;
  background:#f8fafc;
  padding:14px;
  border-radius:10px;
}

.error{
  display:none;
  color:red;
  font-size:12px;
  margin-bottom:10px;
}

.invalid{
  border:1px solid red !important;
}

button{
  background:#111;
  color:white;
  border:none;
  padding:15px;
  font-size:16px;
  cursor:pointer;
  margin-top:20px;
}

button:hover{
  opacity:.9;
}

#loading{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.5);
  justify-content:center;
  align-items:center;
  color:white;
  font-size:24px;
  z-index:999;
}

#success{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:30px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 0 30px rgba(0,0,0,.2);
  z-index:1000;
}
</style>
</head>

<body>

<div id="loading">
  Submitting Order...
</div>

<div id="success">
  <h2>✅ খেলা শেষ...</h2>
  <p>Order saved successfully</p>
  <button onclick="closePopup()">OK</button>
</div>

<div class="container">

  <h2>GSBD Order Management</h2>

  <p class="sub">
    Order Confirmation & Inventory Management
  </p>


  <!-- CUSTOMER NAME -->

  <label>Customer Name *</label>

  <input
    id="name"
    placeholder="Enter customer name"
  >

  <small
    id="name-error"
    class="error"
  >
    Required field
  </small>


  <!-- PHONE -->

  <label>Phone Number *</label>

  <input
    id="phone"
    placeholder="Enter phone number"
  >

  <small
    id="phone-error"
    class="error"
  >
    Required field
  </small>


  <!-- ADDRESS -->

  <label>Customer Address *</label>

  <textarea
    id="address"
    placeholder="Enter address"
  ></textarea>

  <small
    id="address-error"
    class="error"
  >
    Required field
  </small>


  <!-- PRODUCT -->

  <label>Product *</label>

  <select id="product">
    <option value="">
      Loading...
    </option>
  </select>

  <small
    id="product-error"
    class="error"
  >
    Required field
  </small>


  <!-- PRODUCT INFO -->

  <div class="stats">

    <div class="box">
      Stock Left:
      <b id="stock">0</b>
    </div>

    <div class="box">
      Unit Price:
      ৳ <b id="price">0</b>
    </div>

  </div>


  <!-- QUANTITY -->

  <label>Quantity *</label>

  <input
    id="qty"
    type="number"
    min="1"
    placeholder="Enter quantity"
  >

  <small
    id="qty-error"
    class="error"
  >
    Required field
  </small>


  <!-- DELIVERY AREA -->

  <label>Delivery Area *</label>

  <select id="area">

    <option value="Inside Dhaka">
      Inside Dhaka
    </option>

    <option value="Outside Dhaka">
      Outside Dhaka
    </option>

  </select>


  <!-- DELIVERY PAID -->

  <label>Customer Paid Delivery? *</label>

  <select id="paid">

    <option value="">
      Select option
    </option>

    <option value="Yes">
      Yes
    </option>

    <option value="No">
      No
    </option>

  </select>

  <small
    id="paid-error"
    class="error"
  >
    Required field
  </small>


  <!-- DISCOUNT -->

  <label>Discount (৳)</label>

  <input
    id="discount"
    type="number"
    min="0"
    placeholder="Optional"
  >


  <!-- MODERATOR -->

  <label>Moderator *</label>

  <select id="moderator">

    <option value="">
      Loading...
    </option>

  </select>

  <small
    id="moderator-error"
    class="error"
  >
    Required field
  </small>


  <!-- NOTES -->

  <label>Order Notes</label>

  <textarea
    id="note"
    placeholder="Optional"
  ></textarea>


  <!-- FINAL BILL -->

  <div class="box">

    Final Bill:
    ৳ <b id="bill">0</b>

  </div>


  <!-- SUBMIT -->

  <button
    onclick="submitOrder()"
  >
    Confirm Order
  </button>

</div>


<script>

/* ==================================================
   API
================================================== */

const API =
  "https://script.google.com/macros/s/AKfycbw0CMAM4E00q0gFAQ3XlHqnKt1l8RrzqFnwGfMXnr4xVgkAp-fBtR6kpaQMh5aFOkar/exec";


/* ==================================================
   ELEMENTS
================================================== */

const nameInput =
  document.getElementById("name");

const phoneInput =
  document.getElementById("phone");

const addressInput =
  document.getElementById("address");

const productSelect =
  document.getElementById("product");

const stockDisplay =
  document.getElementById("stock");

const priceDisplay =
  document.getElementById("price");

const qtyInput =
  document.getElementById("qty");

const areaSelect =
  document.getElementById("area");

const paidSelect =
  document.getElementById("paid");

const discountInput =
  document.getElementById("discount");

const moderatorSelect =
  document.getElementById("moderator");

const noteInput =
  document.getElementById("note");

const billDisplay =
  document.getElementById("bill");

const loading =
  document.getElementById("loading");

const success =
  document.getElementById("success");


/* ==================================================
   PRODUCT DATA
================================================== */

let products = [];


/* ==================================================
   LOAD PRODUCTS + MODERATORS
================================================== */

async function load(){

  try{

    /*
     * GET INVENTORY
     */

    const productResponse =
      await fetch(API);

    if(!productResponse.ok){

      throw new Error(
        "Unable to load inventory."
      );

    }

    products =
      await productResponse.json();


    /*
     * Make sure API returned an array
     */

    if(!Array.isArray(products)){

      throw new Error(
        "Invalid inventory response."
      );

    }


    /*
     * Populate product dropdown
     */

    productSelect.innerHTML =
      '<option value="">Select product</option>';


    products.forEach(function(p){

      const option =
        document.createElement("option");

      /*
       * Product name is now the value.
       *
       * Your Code.gs uses:
       * Column B = Product Name
       */

      option.value =
        p.name;

      option.textContent =
        p.name;

      productSelect.appendChild(
        option
      );

    });


    /*
     * GET MODERATORS
     */

    const moderatorResponse =
      await fetch(
        API + "?type=moderators"
      );


    if(!moderatorResponse.ok){

      throw new Error(
        "Unable to load moderators."
      );

    }


    const moderators =
      await moderatorResponse.json();


    if(!Array.isArray(moderators)){

      throw new Error(
        "Invalid moderator response."
      );

    }


    /*
     * Populate moderator dropdown
     */

    moderatorSelect.innerHTML =
      '<option value="">Select moderator</option>';


    moderators.forEach(function(m){

      const option =
        document.createElement("option");

      option.value =
        m;

      option.textContent =
        m;

      moderatorSelect.appendChild(
        option
      );

    });


    /*
     * Update product information
     */

    update();


  }catch(error){

    console.error(error);

    productSelect.innerHTML =
      '<option value="">Failed to load products</option>';

    moderatorSelect.innerHTML =
      '<option value="">Failed to load moderators</option>';

    alert(
      "Unable to load inventory. Please refresh the page."
    );

  }

}


/* ==================================================
   GET SELECTED PRODUCT
================================================== */

function getSelectedProduct(){

  const selectedName =
    productSelect.value;


  return products.find(function(p){

    return String(p.name).trim() ===
           String(selectedName).trim();

  }) || {

    name:"",
    colour:"",
    stock:0,
    price:0

  };

}


/* ==================================================
   UPDATE PRODUCT INFO + BILL
================================================== */

function update(){

  const p =
    getSelectedProduct();


  /*
   * Show stock
   */

  stockDisplay.innerText =
    Number(p.stock || 0);


  /*
   * Show price
   */

  priceDisplay.innerText =
    Number(p.price || 0);


  /*
   * Delivery fee
   */

  const fee =
    areaSelect.value === "Inside Dhaka"
      ? 60
      : 120;


  /*
   * Discount
   */

  const discountValue =
    Number(
      discountInput.value
    ) || 0;


  /*
   * Quantity
   */

  const quantity =
    Number(
      qtyInput.value
    ) || 0;


  /*
   * Product price
   */

  const unitPrice =
    Number(
      p.price
    ) || 0;


  /*
   * Calculate final bill
   */

  let total =
    (
      quantity *
      unitPrice
    ) -
    discountValue;


  /*
   * Add delivery fee only
   * when customer has NOT paid it.
   */

  if(
    paidSelect.value === "No"
  ){

    total += fee;

  }


  /*
   * Never allow negative bill
   */

  total =
    Math.max(
      0,
      total
    );


  billDisplay.innerText =
    total;

}


/* ==================================================
   VALIDATION
================================================== */

function validate(
  id,
  errorId
){

  const field =
    document.getElementById(id);

  const error =
    document.getElementById(errorId);


  if(
    !field.value.trim()
  ){

    field.classList.add(
      "invalid"
    );

    error.style.display =
      "block";

    return false;

  }


  field.classList.remove(
    "invalid"
  );

  error.style.display =
    "none";

  return true;

}


/* ==================================================
   SUBMIT ORDER
================================================== */

async function submitOrder(){

  let valid = true;


  valid =
    validate(
      "name",
      "name-error"
    ) && valid;


  valid =
    validate(
      "phone",
      "phone-error"
    ) && valid;


  valid =
    validate(
      "address",
      "address-error"
    ) && valid;


  valid =
    validate(
      "qty",
      "qty-error"
    ) && valid;


  valid =
    validate(
      "moderator",
      "moderator-error"
    ) && valid;


  valid =
    validate(
      "paid",
      "paid-error"
    ) && valid;


  /*
   * Product validation
   */

  if(
    !productSelect.value
  ){

    document
      .getElementById(
        "product-error"
      )
      .style.display =
        "block";

    productSelect.classList.add(
      "invalid"
    );

    valid = false;

  }else{

    document
      .getElementById(
        "product-error"
      )
      .style.display =
        "none";

    productSelect.classList.remove(
      "invalid"
    );

  }


  if(!valid){

    return;

  }


  /*
   * Selected product
   */

  const selected =
    getSelectedProduct();


  if(!selected.name){

    alert(
      "Product not found."
    );

    return;

  }


  /*
   * Quantity
   */

  const quantity =
    Number(
      qtyInput.value
    );


  if(
    !Number.isFinite(quantity) ||
    quantity <= 0
  ){

    alert(
      "Please enter a valid quantity."
    );

    return;

  }


  /*
   * Stock check
   */

  const availableStock =
    Number(
      selected.stock
    ) || 0;


  if(
    quantity >
    availableStock
  ){

    alert(
      "Insufficient stock.\n\n" +
      "Available stock: " +
      availableStock
    );

    return;

  }


  /*
   * Delivery fee
   */

  const fee =
    areaSelect.value ===
    "Inside Dhaka"
      ? 60
      : 120;


  /*
   * Show loading
   */

  loading.style.display =
    "flex";


  try{

    /*
     * Send order
     */

    const response =
      await fetch(
        API,
        {

          method:"POST",

          body:
            JSON.stringify({

              name:
                nameInput.value.trim(),

              phone:
                phoneInput.value.trim(),

              address:
                addressInput.value.trim(),

              product:
                selected.name,

              qty:
                quantity,

              unitPrice:
                Number(
                  selected.price
                ) || 0,

              deliveryArea:
                areaSelect.value,

              deliveryPaid:
                paidSelect.value,

              deliveryFee:
                fee,

              discount:
                Number(
                  discountInput.value
                ) || 0,

              finalBill:
                Number(
                  billDisplay.innerText
                ) || 0,

              note:
                noteInput.value.trim(),

              moderator:
                moderatorSelect.value

            })

        }
      );


    /*
     * Read response
     */

    const result =
      await response.json();


    /*
     * Hide loading
     */

    loading.style.display =
      "none";


    /*
     * Check result
     */

    if(
      !result.success
    ){

      alert(
        result.message ||
        "Order failed."
      );

      return;

    }


    /*
     * Success
     */

    success.style.display =
      "block";


  }catch(error){

    loading.style.display =
      "none";


    console.error(error);


    alert(
      "Something went wrong while submitting the order."
    );

  }

}


/* ==================================================
   CLOSE SUCCESS POPUP
================================================== */

function closePopup(){

  success.style.display =
    "none";

  location.reload();

}


/* ==================================================
   EVENT LISTENERS
================================================== */

document.addEventListener(
  "change",
  function(){

    update();

  }
);


document.addEventListener(
  "input",
  function(){

    update();

  }
);


/* ==================================================
   START
================================================== */

load();

</script>

</body>
</html>
