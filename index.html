<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GSBD Order Management</title>
<style>
body{font-family:system-ui;background:#f4f7fb;margin:0}
.wrap{max-width:700px;margin:auto;padding:20px}
.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 12px 30px rgba(0,0,0,.08)}
.logo{font-size:30px;font-weight:700}.sub{color:#666}
input,select,textarea,button{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:8px 0;box-sizing:border-box}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f8fafc;padding:12px;border-radius:12px}
button{background:#111;color:#fff;font-size:16px}
.req:after{content:" *";color:red}
</style></head><body>
<div class="wrap"><div class="card">
<div class="logo">GSBD</div><div class="sub">Order Management System</div><hr>
<label class=req>Customer Name</label><input id=name required>
<label class=req>Phone</label><input id=phone required>
<label class=req>Address</label><textarea id=address required></textarea>
<label class=req>Product</label><select id=product></select>
<div class="grid"><div class="stat">Stock Left: <b id=stock>0</b></div><div class="stat">Unit Price: <b id=price>0</b></div></div>
<label class=req>Qty</label><input id=qty type=number required>
<label class=req>Delivery Area</label><select id=area><option>Inside Dhaka</option><option>Outside Dhaka</option></select>
<label class=req>Delivery Paid?</label><select id=paid><option>Yes</option><option>No</option></select>
<label class=req>Moderator</label><select id=moderator></select>
<label>Note</label><textarea id=note></textarea>
<div class="stat">Final Bill: <b id=bill>0</b></div>
<button onclick="submitOrder()">Confirm Order</button>
</div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbw0CMAM4E00q0gFAQ3XlHqnKt1l8RrzqFnwGfMXnr4xVgkAp-fBtR6kpaQMh5aFOkar/exec";
let products=[];
window.onload=async function(){
 let response=await fetch(API);
 products=await response.json();
 product.innerHTML=products.map(x=>`<option value="${x.name}">${x.name}</option>`).join("");
 let mods=await fetch(API+"?type=moderators");
 let moderators=await mods.json();
 moderator.innerHTML=moderators.map(m=>`<option>${m}</option>`).join("");
 update();
}
function update(){
 let p=products.find(x=>x.name===product.value)||{price:0,stock:0};
 price.innerText=p.price; stock.innerText=p.stock;
 let fee=area.value=="Inside Dhaka"?60:120;
 bill.innerText=(qty.value||0)*p.price+(paid.value=="No"?fee:0);
}
['product','qty','area','paid'].forEach(id=>document.addEventListener('change',e=>update()));
async function submitOrder(){
 for(let id of ['name','phone','address','qty']) if(!document.getElementById(id).value){alert("Fill all required fields");return;}
 let p=products.find(x=>x.name===product.value);
 if(+qty.value>p.stock){alert("Insufficient stock");return;}
 let fee=area.value=="Inside Dhaka"?60:120;
 await fetch(API,{method:"POST",body:JSON.stringify({name:name.value,phone:phone.value,address:address.value,product:product.value,qty:+qty.value,unitPrice:p.price,deliveryArea:area.value,deliveryPaid:paid.value,deliveryFee:fee,finalBill:+bill.innerText,note:note.value,moderator:moderator.value})});
 alert("Order saved"); location.reload();
}
</script></body></html>
