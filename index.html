<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>GSBD Order Management</title>


<style>

/* ==================================================
   BODY
================================================== */

body{

  font-family:
    Arial,
    sans-serif;

  background:
    #f4f7fb;

  padding:
    20px;

  margin:
    0;

}


/* ==================================================
   CONTAINER
================================================== */

.container{

  max-width:
    700px;

  margin:
    auto;

  background:
    white;

  padding:
    25px;

  border-radius:
    20px;

  box-shadow:
    0 10px 25px
    rgba(0,0,0,.08);

}


/* ==================================================
   HEADINGS
================================================== */

h2{

  margin-bottom:
    5px;

}


.sub{

  color:
    #666;

  margin-bottom:
    25px;

}


/* ==================================================
   LABELS
================================================== */

label{

  display:
    block;

  font-weight:
    600;

  margin-top:
    12px;

  margin-bottom:
    5px;

}


/* ==================================================
   INPUTS
================================================== */

input,
select,
textarea,
button{

  width:
    100%;

  padding:
    14px;

  border:
    1px solid #ddd;

  border-radius:
    10px;

  box-sizing:
    border-box;

  margin-bottom:
    5px;

}


textarea{

  min-height:
    80px;

}


/* ==================================================
   PRODUCT SEARCH
================================================== */

.search-wrapper{

  position:
    relative;

  margin-bottom:
    8px;

}


#productSearch{

  width:
    100%;

  padding:
    13px 14px;

  border:
    1px solid #ccc;

  border-radius:
    10px;

  box-sizing:
    border-box;

  font-size:
    14px;

  outline:
    none;

}


#productSearch:focus{

  border-color:
    #111;

}


/* ==================================================
   SEARCH RESULT COUNT
================================================== */

#searchInfo{

  font-size:
    12px;

  color:
    #777;

  margin:
    4px 0 7px 2px;

}


/* ==================================================
   STATS
================================================== */

.stats{

  display:
    flex;

  gap:
    10px;

  margin-top:
    10px;

}


.box{

  flex:
    1;

  background:
    #f8fafc;

  padding:
    14px;

  border-radius:
    10px;

}


/* ==================================================
   ERROR
================================================== */

.error{

  display:
    none;

  color:
    red;

  font-size:
    12px;

  margin-bottom:
    10px;

}


.invalid{

  border:
    1px solid red !important;

}


/* ==================================================
   BUTTON
================================================== */

button{

  background:
    #111;

  color:
    white;

  border:
    none;

  padding:
    15px;

  font-size:
    16px;

  cursor:
    pointer;

  margin-top:
    20px;

}


button:hover{

  opacity:
    .9;

}


/* ==================================================
   LOADING
================================================== */

#loading{

  display:
    none;

  position:
    fixed;

  top:
    0;

  left:
    0;

  width:
    100%;

  height:
    100%;

  background:
    rgba(0,0,0,.5);

  justify-content:
    center;

  align-items:
    center;

  color:
    white;

  font-size:
    24px;

  z-index:
    999;

}


/* ==================================================
   SUCCESS
================================================== */

#success{

  display:
    none;

  position:
    fixed;

  top:
    50%;

  left:
    50%;

  transform:
    translate(-50%,-50%);

  background:
    white;

  padding:
    30px;

  border-radius:
    20px;

  text-align:
    center;

  box-shadow:
    0 0 30px
    rgba(0,0,0,.2);

  z-index:
    1000;

}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:600px){

  body{

    padding:
      10px;

  }


  .container{

    padding:
      18px;

    border-radius:
      15px;

  }


  .stats{

    flex-direction:
      column;

  }

}

</style>

</head>


<body>


<!-- =================================================
     LOADING
================================================= -->

<div id="loading">

  Submitting Order...

</div>


<!-- =================================================
     SUCCESS
================================================= -->

<div id="success">

  <h2>
    ✅ খেলা শেষ...
  </h2>

  <p>
    Order saved successfully
  </p>

  <button
    onclick="closePopup()"
  >
    OK
  </button>

</div>


<!-- =================================================
     MAIN CONTAINER
================================================= -->

<div class="container">


  <h2>
    GSBD Order Management
  </h2>


  <p class="sub">
    Order Confirmation & Inventory Management
  </p>


  <!-- =================================================
       CUSTOMER NAME
  ================================================= -->

  <label>
    Customer Name *
  </label>


  <input
    id="name"
    placeholder="Enter customer name"
  >


  <small
    id="name-error"
    class="error"
  >
    Required field
  </small>


  <!-- =================================================
       PHONE
  ================================================= -->

  <label>
    Phone Number *
  </label>


  <input
    id="phone"
    placeholder="Enter phone number"
  >


  <small
    id="phone-error"
    class="error"
  >
    Required field
  </small>


  <!-- =================================================
       ADDRESS
  ================================================= -->

  <label>
    Customer Address *
  </label>


  <textarea
    id="address"
    placeholder="Enter address"
  ></textarea>


  <small
    id="address-error"
    class="error"
  >
    Required field
  </small>


  <!-- =================================================
       PRODUCT SEARCH
  ================================================= -->

  <label>
    Search Product
  </label>


  <div class="search-wrapper">

    <input
      id="productSearch"
      type="text"
      placeholder="Type product name to search..."
      autocomplete="off"
    >

  </div>


  <div id="searchInfo">
    Loading products...
  </div>


  <!-- =================================================
       PRODUCT
  ================================================= -->

  <label>
    Product *
  </label>


  <select id="product">

    <option value="">
      Loading...
    </option>

  </select>


  <small
    id="product-error"
    class="error"
  >
    Required field
  </small>


  <!-- =================================================
       STOCK / PRICE
  ================================================= -->

  <div class="stats">


    <div class="box">

      Stock Left:
      <b id="stock">
        0
      </b>

    </div>


    <div class="box">

      Unit Price:
      ৳
      <b id="price">
        0
      </b>

    </div>


  </div>


  <!-- =================================================
       QUANTITY
  ================================================= -->

  <label>
    Quantity *
  </label>


  <input
    id="qty"
    type="number"
    min="1"
    placeholder="Enter quantity"
  >


  <small
    id="qty-error"
    class="error"
  >
    Required field
  </small>


  <!-- =================================================
       DELIVERY AREA
  ================================================= -->

  <label>
    Delivery Area *
  </label>


  <select id="area">

    <option value="Inside Dhaka">
      Inside Dhaka
    </option>

    <option value="Outside Dhaka">
      Outside Dhaka
    </option>

  </select>


  <!-- =================================================
       DELIVERY PAID
  ================================================= -->

  <label>
    Customer Paid Delivery? *
  </label>


  <select id="paid">

    <option value="">
      Select option
    </option>

    <option value="Yes">
      Yes
    </option>

    <option value="No">
      No
    </option>

  </select>


  <small
    id="paid-error"
    class="error"
  >
    Required field
  </small>


  <!-- =================================================
       DISCOUNT
  ================================================= -->

  <label>
    Discount (৳)
  </label>


  <input
    id="discount"
    type="number"
    min="0"
    placeholder="Optional"
  >


  <!-- =================================================
       MODERATOR
  ================================================= -->

  <label>
    Moderator *
  </label>


  <select id="moderator">

    <option value="">
      Loading...
    </option>

  </select>


  <small
    id="moderator-error"
    class="error"
  >
    Required field
  </small>


  <!-- =================================================
       NOTES
  ================================================= -->

  <label>
    Order Notes
  </label>


  <textarea
    id="note"
    placeholder="Optional"
  ></textarea>


  <!-- =================================================
       FINAL BILL
  ================================================= -->

  <div class="box">

    Final Bill:
    ৳
    <b id="bill">
      0
    </b>

  </div>


  <!-- =================================================
       SUBMIT
  ================================================= -->

  <button
    onclick="submitOrder()"
  >
    Confirm Order
  </button>


</div>


<script>


/* ==================================================
   API
================================================== */

const API =
  "https://script.google.com/macros/s/AKfycbw0CMAM4E00q0gFAQ3XlHqnKt1l8RrzqFnwGfMXnr4xVgkAp-fBtR6kpaQMh5aFOkar/exec";


/* ==================================================
   ELEMENTS
================================================== */

const nameInput =
  document.getElementById(
    "name"
  );


const phoneInput =
  document.getElementById(
    "phone"
  );


const addressInput =
  document.getElementById(
    "address"
  );


const productSearch =
  document.getElementById(
    "productSearch"
  );


const productSelect =
  document.getElementById(
    "product"
  );


const searchInfo =
  document.getElementById(
    "searchInfo"
  );


const stockDisplay =
  document.getElementById(
    "stock"
  );


const priceDisplay =
  document.getElementById(
    "price"
  );


const qtyInput =
  document.getElementById(
    "qty"
  );


const areaSelect =
  document.getElementById(
    "area"
  );


const paidSelect =
  document.getElementById(
    "paid"
  );


const discountInput =
  document.getElementById(
    "discount"
  );


const moderatorSelect =
  document.getElementById(
    "moderator"
  );


const noteInput =
  document.getElementById(
    "note"
  );


const billDisplay =
  document.getElementById(
    "bill"
  );


const loading =
  document.getElementById(
    "loading"
  );


const success =
  document.getElementById(
    "success"
  );


/* ==================================================
   PRODUCT DATA
================================================== */

let products = [];


/* ==================================================
   LOAD DATA
================================================== */

async function load(){

  try{


    /* ----------------------------------------------
       CACHE BUSTER
    ---------------------------------------------- */

    const inventoryURL =
      API +
      "?cache=" +
      Date.now();


    /* ----------------------------------------------
       LOAD INVENTORY
    ---------------------------------------------- */

    const productResponse =
      await fetch(
        inventoryURL,
        {
          cache:
            "no-store"
        }
      );


    if(
      !productResponse.ok
    ){

      throw new Error(
        "Inventory request failed."
      );

    }


    products =
      await productResponse.json();


    if(
      !Array.isArray(
        products
      )
    ){

      throw new Error(
        "Invalid inventory response."
      );

    }


    /* ----------------------------------------------
       LOAD PRODUCT DROPDOWN
    ---------------------------------------------- */

    renderProducts(
      products
    );


    /* ----------------------------------------------
       LOAD MODERATORS
    ---------------------------------------------- */

    const moderatorURL =
      API +
      "?type=moderators&cache=" +
      Date.now();


    const moderatorResponse =
      await fetch(
        moderatorURL,
        {
          cache:
            "no-store"
        }
      );


    if(
      !moderatorResponse.ok
    ){

      throw new Error(
        "Moderator request failed."
      );

    }


    const moderators =
      await moderatorResponse.json();


    if(
      !Array.isArray(
        moderators
      )
    ){

      throw new Error(
        "Invalid moderator response."
      );

    }


    moderatorSelect.innerHTML =
      '<option value="">Select moderator</option>';


    moderators.forEach(
      function(moderator){

        const option =
          document.createElement(
            "option"
          );


        option.value =
          moderator;


        option.textContent =
          moderator;


        moderatorSelect.appendChild(
          option
        );

      }
    );


    update();


  }catch(error){

    console.error(
      error
    );


    productSelect.innerHTML =
      '<option value="">Failed to load products</option>';


    moderatorSelect.innerHTML =
      '<option value="">Failed to load moderators</option>';


    searchInfo.innerText =
      "Failed to load products.";


    alert(
      "Unable to load inventory. Please refresh the page."
    );

  }

}


/* ==================================================
   RENDER PRODUCTS
================================================== */

function renderProducts(
  list
){

  productSelect.innerHTML =
    "";


  if(
    list.length === 0
  ){

    productSelect.innerHTML =
      '<option value="">No products found</option>';


    searchInfo.innerText =
      "No products found.";


    return;

  }


  list.forEach(
    function(product){

      const option =
        document.createElement(
          "option"
        );


      /*
       * Product name is the
       * unique selection value.
       */

      option.value =
        product.name;


      option.textContent =
        product.name;


      productSelect.appendChild(
        option
      );

    }
  );


  searchInfo.innerText =
    list.length +
    " product(s)";


  update();

}


/* ==================================================
   PRODUCT SEARCH
================================================== */

productSearch.addEventListener(
  "input",
  function(){

    const search =
      productSearch.value
        .trim()
        .toLowerCase();


    if(
      !search
    ){

      renderProducts(
        products
      );

      return;

    }


    const filtered =
      products.filter(
        function(product){

          return product.name
            .toLowerCase()
            .includes(search);

        }
      );


    renderProducts(
      filtered
    );


    if(
      filtered.length > 0
    ){

      productSelect.value =
        filtered[0].name;

      update();

    }

  }
);


/* ==================================================
   GET SELECTED PRODUCT
================================================== */

function getSelectedProduct(){

  const selectedName =
    productSelect.value;


  return products.find(
    function(product){

      return String(
        product.name
      ).trim() ===
      String(
        selectedName
      ).trim();

    }
  ) || {

    name:
      "",

    colour:
      "",

    stock:
      0,

    price:
      0

  };

}


/* ==================================================
   UPDATE STOCK / PRICE / BILL
================================================== */

function update(){

  const product =
    getSelectedProduct();


  /*
   * STOCK
   */

  stockDisplay.innerText =
    Number(
      product.stock || 0
    );


  /*
   * PRICE
   */

  priceDisplay.innerText =
    Number(
      product.price || 0
    );


  /*
   * DELIVERY FEE
   */

  const fee =
    areaSelect.value ===
    "Inside Dhaka"
      ? 60
      : 120;


  /*
   * QUANTITY
   */

  const quantity =
    Number(
      qtyInput.value
    ) || 0;


  /*
   * DISCOUNT
   */

  const discount =
    Number(
      discountInput.value
    ) || 0;


  /*
   * PRODUCT PRICE
   */

  const unitPrice =
    Number(
      product.price
    ) || 0;


  /*
   * TOTAL
   */

  let total =
    (
      quantity *
      unitPrice
    ) -
    discount;


  /*
   * DELIVERY CHARGE
   */

  if(
    paidSelect.value ===
    "No"
  ){

    total += fee;

  }


  /*
   * Prevent negative bill
   */

  total =
    Math.max(
      0,
      total
    );


  billDisplay.innerText =
    total;

}


/* ==================================================
   VALIDATE
================================================== */

function validate(
  id,
  errorId
){

  const field =
    document.getElementById(
      id
    );


  const error =
    document.getElementById(
      errorId
    );


  if(
    !field.value.trim()
  ){

    field.classList.add(
      "invalid"
    );


    error.style.display =
      "block";


    return false;

  }


  field.classList.remove(
    "invalid"
  );


  error.style.display =
    "none";


  return true;

}


/* ==================================================
   SUBMIT ORDER
================================================== */

async function submitOrder(){

  let valid = true;


  valid =
    validate(
      "name",
      "name-error"
    ) && valid;


  valid =
    validate(
      "phone",
      "phone-error"
    ) && valid;


  valid =
    validate(
      "address",
      "address-error"
    ) && valid;


  valid =
    validate(
      "qty",
      "qty-error"
    ) && valid;


  valid =
    validate(
      "moderator",
      "moderator-error"
    ) && valid;


  valid =
    validate(
      "paid",
      "paid-error"
    ) && valid;


  /*
   * PRODUCT VALIDATION
   */

  if(
    !productSelect.value
  ){

    productSelect.classList.add(
      "invalid"
    );


    document
      .getElementById(
        "product-error"
      )
      .style.display =
        "block";


    valid = false;

  }else{

    productSelect.classList.remove(
      "invalid"
    );


    document
      .getElementById(
        "product-error"
      )
      .style.display =
        "none";

  }


  if(
    !valid
  ){

    return;

  }


  /* ----------------------------------------------
     SELECTED PRODUCT
  ---------------------------------------------- */

  const selected =
    getSelectedProduct();


  if(
    !selected.name
  ){

    alert(
      "Product not found."
    );

    return;

  }


  /* ----------------------------------------------
     QUANTITY
  ---------------------------------------------- */

  const quantity =
    Number(
      qtyInput.value
    );


  if(
    !Number.isInteger(
      quantity
    ) ||
    quantity <= 0
  ){

    alert(
      "Please enter a valid quantity."
    );

    return;

  }


  /* ----------------------------------------------
     STOCK
  ---------------------------------------------- */

  const availableStock =
    Number(
      selected.stock
    ) || 0;


  if(
    quantity >
    availableStock
  ){

    alert(
      "Insufficient stock.\n\n" +
      "Available stock: " +
      availableStock
    );

    return;

  }


  /* ----------------------------------------------
     DELIVERY
  ---------------------------------------------- */

  const deliveryFee =
    areaSelect.value ===
    "Inside Dhaka"
      ? 60
      : 120;


  /* ----------------------------------------------
     LOADING
  ---------------------------------------------- */

  loading.style.display =
    "flex";


  try{


    /* --------------------------------------------
       SUBMIT
    -------------------------------------------- */

    const response =
      await fetch(
        API +
        "?submit=" +
        Date.now(),
        {

          method:
            "POST",

          cache:
            "no-store",

          body:
            JSON.stringify({

              name:
                nameInput.value.trim(),

              phone:
                phoneInput.value.trim(),

              address:
                addressInput.value.trim(),

              product:
                selected.name,

              qty:
                quantity,

              unitPrice:
                Number(
                  selected.price
                ) || 0,

              deliveryArea:
                areaSelect.value,

              deliveryPaid:
                paidSelect.value,

              deliveryFee:
                deliveryFee,

              discount:
                Number(
                  discountInput.value
                ) || 0,

              finalBill:
                Number(
                  billDisplay.innerText
                ) || 0,

              note:
                noteInput.value.trim(),

              moderator:
                moderatorSelect.value

            })

        }
      );


    const result =
      await response.json();


    loading.style.display =
      "none";


    /* --------------------------------------------
       ERROR
    -------------------------------------------- */

    if(
      !result.success
    ){

      alert(
        result.message ||
        "Order failed."
      );

      return;

    }


    /* --------------------------------------------
       SUCCESS
    -------------------------------------------- */

    success.style.display =
      "block";


  }catch(error){

    loading.style.display =
      "none";


    console.error(
      error
    );


    alert(
      "Something went wrong while submitting the order."
    );

  }

}


/* ==================================================
   CLOSE SUCCESS
================================================== */

function closePopup(){

  success.style.display =
    "none";


  location.reload();

}


/* ==================================================
   EVENT LISTENERS
================================================== */

productSelect.addEventListener(
  "change",
  function(){

    update();

  }
);


areaSelect.addEventListener(
  "change",
  function(){

    update();

  }
);


paidSelect.addEventListener(
  "change",
  function(){

    update();

  }
);


qtyInput.addEventListener(
  "input",
  function(){

    update();

  }
);


discountInput.addEventListener(
  "input",
  function(){

    update();

  }
);


/* ==================================================
   START
================================================== */

load();

</script>

</body>

</html>
